name: Build Android app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the app
        run: |
          mkdir build && cd build
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png www/
          npx cap init "Tap Budget" io.github.lichtung1.tapbudget --web-dir www
          npx cap add android
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp www/icon-192.png "$d/ic_launcher.png"
            cp www/icon-192.png "$d/ic_launcher_round.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tap-budget-app
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
